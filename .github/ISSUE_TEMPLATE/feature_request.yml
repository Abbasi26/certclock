name: Feature request
description: Suggest a source, output, check, or workflow for certclock.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it. Example input and output help a lot.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked ROADMAP.md and the open issues for duplicates
        - label: I would be willing to open a pull request for this
