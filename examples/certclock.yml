# Paths are relative to this file. The hosts list is comments only, so a scan
# does not open a network connection. Replace it with your own endpoints.
database: certclock.db
output_dir: certclock-out
hosts_file: hosts.txt
file_paths: []
owners_file: owners.yml
windows_json:
  - windows-store.json
linux_json:
  - linux-files.json
adcs_csv:
  - path: adcs-issued.csv
    issuer: "CN=Example Laboratory Issuing CA"
tls_timeout_seconds: 8
horizon_days: 90
warn_days: 30
crit_days: 7
weak_rsa_bits: 2048
# Flag end-entity certificates valid for longer than this (CA/B Forum: 100 days from 15 Mar 2027). 0 = off.
max_validity_days: 100
notify_within_days: 30
webhook:
  enabled: false
  url: ""
  format: generic
