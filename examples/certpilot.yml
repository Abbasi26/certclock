# Paths are relative to this file. The hosts list is comments only, so a scan
# does not open a network connection. Replace it with your own endpoints.
database: certpilot.db
output_dir: certpilot-out
hosts_file: hosts.txt
file_paths: []
owners_file: owners.yml
windows_json:
  - windows-store.json
linux_json:
  - linux-files.json
adcs_csv:
  - path: adcs-issued.csv
    issuer: "CN=Example Laboratory Issuing CA"
tls_timeout_seconds: 8
horizon_days: 90
warn_days: 30
crit_days: 7
weak_rsa_bits: 2048
notify_within_days: 30
webhook:
  enabled: false
  url: ""
  format: generic
