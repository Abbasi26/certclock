# Example: run certclock check every night against a list of endpoints.
# Copy to .github/workflows/nightly-scan.yml, adjust hosts/paths, and pin a tag.
name: nightly-scan

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Nightly check
        run: |
          mkdir -p certclock-out
          certclock check \
            --hosts-file examples/hosts.txt \
            --path examples \
            --db certclock.db \
            --fail-on crit \
            --format markdown \
            --output certclock-out/report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certclock-nightly-report
          path: certclock-out/
