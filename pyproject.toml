[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certpilot"
version = "0.1.0"
description = "Agentless certificate expiry radar that puts scattered certificate sources on one timeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Wasaf Abbasi"}]
keywords = ["certificates", "x509", "tls", "expiry", "pki", "adcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "cryptography>=42",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
certpilot = "certpilot.cli:main"

[project.entry-points."certpilot.collectors"]
tls = "certpilot.collectors.tls:TlsCollector"
files = "certpilot.collectors.files:FileCollector"
windows = "certpilot.collectors.windows_store:WindowsStoreCollector"
adcs = "certpilot.collectors.adcs:AdcsCollector"
linux = "certpilot.collectors.linux_json:LinuxJsonCollector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certpilot = ["py.typed", "bundled/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
