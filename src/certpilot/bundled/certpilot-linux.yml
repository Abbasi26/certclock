---
# Read-only CertPilot collector for Linux certificate files.
# It does not change remote certificates. Ansible copies this script to a
# temporary directory on each host, runs it, and deletes that copy.
#
#   ansible-playbook certpilot-linux.yml -i inventory.ini
#
# inventory.ini:
#   [certpilot_linux]
#   web01.example.test
#
# Import the JSON CertPilot writes on the controller:
#   certpilot import linux --db certpilot.db ./certpilot-linux/web01.example.test.json
- name: Collect certificate metadata for CertPilot
  hosts: certpilot_linux
  gather_facts: false
  become: false
  vars:
    certpilot_paths:
      - /etc/ssl
      - /etc/pki
    certpilot_output_dir: ./certpilot-linux
  tasks:
    - name: Read certificate metadata
      ansible.builtin.script: >-
        {{ playbook_dir }}/collect_linux_certs.py
        {{ certpilot_paths | join(' ') }}
      register: certpilot_collect
      changed_when: false
      args:
        executable: python3

    - name: Create the local output directory
      ansible.builtin.file:
        path: "{{ certpilot_output_dir }}"
        state: directory
      delegate_to: localhost
      connection: local

    - name: Save the JSON on the controller
      ansible.builtin.copy:
        dest: "{{ certpilot_output_dir }}/{{ inventory_hostname }}.json"
        content: "{{ certpilot_collect.stdout }}"
      delegate_to: localhost
      connection: local
      changed_when: false
